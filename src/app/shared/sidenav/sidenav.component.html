<div class="bg-light-blue-900 text-white w-16 h-full flex flex-col items-center py-4 space-y-6">
  <div class="pr-9 border-b border-slate-200">
  </div>
  <button
    *ngFor="let item of menuItems"
    class="relative w-full flex justify-center group"
  >
    <!-- Active vertical bar -->
    <div
      class="absolute left-0 h-full w-1.5 rounded-r bg-green-400"
      *ngIf="item.active"
    ></div>

    <!-- Icon button -->
    <div
      class="p-3 transition-colors hover:bg-slate-700 rounded-lg w-full flex justify-center"
    >
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          [attr.d]="item.icon"
          [ngClass]="{ 'text-green-400': item.active }"
        ></path>
      </svg>
    </div>

    <!-- Tooltip -->
    <div
      class="absolute left-full ml-2 px-2 py-1 bg-gray-900 text-sm rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap"
    >
      {{ item.label }}
    </div>
  </button>
</div>
